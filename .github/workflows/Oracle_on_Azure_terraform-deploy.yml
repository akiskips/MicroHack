name: Full Deployment an Oracle DB in a Data Guard configuration on Azure with Terraform and Ansible
on:
  workflow_dispatch:
    inputs:
      rg-list-input:
        description: "Comma-separated list of Resource Groups"
        required: true
        default: "rg-mh-oracle-2"
  
  # push:
  #   branches: [ main ]
  #   paths:
  #     - ".github/workflows/full-dg-tf-deploy.yml"
  #     - "./03-Azure/01-03-Infrastructure/10_Oracle_on_Azure/resources/environment_setup/**"
  #     - "ansible/bootstrap/oracle/**"
  # pull_request:
  #   branches: [ main ]
  #   paths:
  #     - ".github/workflows/full-dg-tf-deploy.yml"
  #     - "./03-Azure/01-03-Infrastructure/10_Oracle_on_Azure/resources/environment_setup/**"
    
env:
  TF_LOG: ${{ secrets.TF_LOG != '' && secrets.TF_LOG || 'INFO' }}                                                     #"INFO"
  AZ_LOCATION: ${{ secrets.AZ_LOCATION != '' && secrets.AZ_LOCATION || 'swedencentral' }}                             #"swedencentral" # can be parameterized
  AZ_RG_BASENAME: ${{ secrets.AZ_RG_BASENAME != '' && secrets.AZ_RG_BASENAME || 'rg-mh-oracle' }}  
  VM_PRIMARY_NAME: ${{ secrets.VM_PRIMARY_NAME != '' && secrets.VM_PRIMARY_NAME || 'vm-primary-0' }}                  # can be parameterized
  VM_SECONDARY_NAME: ${{ secrets.VM_SECONDARY_NAME != '' && secrets.VM_SECONDARY_NAME || 'vm-secondary-0' }}          # can be parameterized
  ORCL_DB_NAME: ${{ secrets.ORCL_DB_NAME != '' && secrets.ORCL_DB_NAME || 'ORCL' }}                                   #"ORCL" # can be parameterized
  SOFTWARE_RG:  ${{ secrets.SOFTWARE_RG != '' && secrets.SOFTWARE_RG || 'binaryresource' }}                           #"binaryresource"
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write
  
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      rg-list: ${{ steps.set-rg-list.outputs.rg-list }}
    steps:
    - uses: actions/checkout@v2
    - id: set-rg-list
      run: |
        # Get the input value (example: "rg1, rg2")
        list="${{ github.event.inputs['rg-list-input'] }}"
        trimmed=$(echo "$list" | sed 's/, */,/g')
        json=$(echo "$list" | sed 's/^/["/; s/$/"]/; s/,/","/g')
        echo "::set-output name=rg-list::${json}"
        echo "rg-list output: ${json}"
  
  terraform:
    needs: setup
    name: '🔧 Terraform'
    runs-on: ubuntu-latest
    environment: test-deploy
    strategy:
      matrix:
        resource_group: ${{ fromJson(needs.setup.outputs.rg-list) }}
  
    defaults:
      run:
        
        shell: bash
        working-directory: ./03-Azure/01-03-Infrastructure/10_Oracle_on_Azure/resources/environment_setup/terraform/data_guard
    steps:

    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    # Install the preferred version of Terraform CLI 
    - name: 📦 Setup Terraform Cli
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.10.3
        terraform_wrapper: false # keep it false to be able to read the outputs values of terraform

    #Check if the SSH key is empty
    - name: 🔎 Validate SSH Key is not empty
      run: |
        if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]
        then
          echo "SSH_PRIVATE_KEY is empty, you should add a SSH key to the repository secrets. Name of the secret should be SSH_PRIVATE_KEY"
          exit 1
        else
          echo "SSH_PRIVATE_KEY is not empty"
        fi
    

    - name: 🗒️ Create the SSH public key for VM
      run: |
        cat > temp_ssh_key <<EOF
        ${{ secrets.SSH_PRIVATE_KEY }}
        EOF
        
        chmod 400 temp_ssh_key
        ssh-keygen -f temp_ssh_key -y > temp_ssh_key.pub

        echo "SSH_KEY=$(cat temp_ssh_key.pub)" >> $GITHUB_ENV
        echo "SSH_KEY=${{env.SSH_KEY}}"

        echo "currentDate=$(date)" >> $GITHUB_ENV
        echo "currentDate=${{env.currentDate}}"

    #   # Generate random string for suffix
    # - name: 🔎 Generate Random String for Resource Group Name
    #   id: resourcegroup-generator
    #   run: echo random=$(tr -dc A-Za-z0-9 </dev/urandom | head -c 8; echo) >> $GITHUB_ENV
    # - run: echo ResourceGroupName=${{env.AZ_RG_BASENAME}}-${{ matrix.resource_group }}-${{env.random}} >> $GITHUB_ENV 
    # - run: echo ${{env.ResourceGroupName}}
    
    #Login to Azure
    # Check https://github.com/Azure/login?tab=readme-ov-file#login-with-openid-connect-oidc-recommended
    - name: 🔑 Login via Azure CLI
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: 🗒️ Create a tfvars file for terraform
      run: |
        echo "matrix rg is output is: ${{ matrix.resource_group }}"
        cat > terraform.tfvars <<EOF
        location = "${{env.AZ_LOCATION}}"
        resourcegroup_name = "${{ matrix.resource_group }}"
        resourcegroup_tags = {
          "environment" = "dev"
          "project"     = "oracle"
          "created"     = "${{env.currentDate}}"
          "GITHUB_ACTOR" = "${{ github.actor }}"
          "GITHUB_ACTION_REPOSITORY" = "${{ github.repository }}"
          "GITHUB_ACTION_REF" = "${{ github.ref }}"
          "GITHUB_RUN_ID" = "${{ github.run_id }}"
          "GITHUB_WORKFLOW" = "${{ github.workflow }}"
        }
        #is_resource_lock_enabled = false
        #is_diagnostic_settings_enabled = true
        #diagnostic_target              = "Log_Analytics_Workspace"
        
        ssh_key = "${{env.SSH_KEY}}"
        EOF

      # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: 📦 Terraform Init
      id: init
      env:
        RESOURCE_GROUP: ${{ matrix.resource_group }}
      run: terraform init


      # Run a terraform validate
    - name: 🔎 Terraform Validate
      id: validate
      if: github.ref != 'refs/heads/main'
      continue-on-error: true
      run: terraform validate -no-color
      

      # Run a terraform plan for pull requests only and add a comment 
    - name: 💻 Terraform Plan
      id: plan
      continue-on-error: true
      run: terraform plan  -var "resourcegroup_name=${{ env.ResourceGroupName }}" -no-color


    - name: "Add a comment to pull requests with plan resutls"
      id: comment
      uses: actions/github-script@v6
      if: (github.event_name == 'pull_request' || github.event_name == 'push')
      env:
        PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
            const output = `
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
            })
            


    - name: "◻️ Terraform Plan Status ⁉️"
      if: steps.plan.outcome == 'failure'
      run: exit 1

          # On push to main, build or change infrastructure according to Terraform configuration files
      # On push to main, build or change infrastructure according to Terraform configuration files
    - name: 💻 Terraform Apply
    #  if: github.ref == 'refs/heads/main' && github.event_name == 'push' # Remove when I am ready
      run: terraform apply -auto-approve 
    
    - name: 🔃 Terraform Refresh State
      run: terraform  apply -refresh-only -auto-approve

    # - run: echo "vm_public_ip_address=$(terraform output vm_public_ip_address)" >> $GITHUB_ENV
    # - run: echo ${{env.vm_public_ip_address}}


    outputs:
      ResourceGroupName: ${{ matrix.resource_group }}
      # VM_Public_IP_Address: ${{ env.vm_public_ip_address }}

